name: CI

# Runs on every push and PR. The audit job additionally runs on a weekly
# schedule so RUSTSEC advisories published after a quiet period are still
# caught.
#
# All jobs use --locked to enforce that the committed Cargo.lock matches
# what the source tree resolves to. A lockfile drift fails the job rather
# than silently picking up newer patch versions.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Saturdays 02:00 UTC — picks up RUSTSEC advisories published mid-week
    # without overlapping a typical Monday-morning push.
    - cron: '0 2 * * 6'
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  # Slim down test artifacts on disk.
  CARGO_INCREMENTAL: "0"
  RUSTFLAGS: "-D warnings"

jobs:
  # ──────────────────────────────────────────────────────────────────
  #  format + lint + check
  # ──────────────────────────────────────────────────────────────────
  check:
    name: Format, lint, check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust 1.91 toolchain
        # Edition 2024 + resolver = "3" require 1.91+. Pinning the version
        # makes the build deterministic across runners.
        run: |
          rustup toolchain install 1.91 --profile minimal --component rustfmt,clippy
          rustup default 1.91

      - name: Cache Cargo registry & build
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-1.91-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-1.91-

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy (workspace, all targets)
        # `-D warnings` already in RUSTFLAGS; this command will fail on any
        # clippy lint at warn level or above.
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Cargo check (workspace)
        run: cargo check --workspace --locked

  # ──────────────────────────────────────────────────────────────────
  #  Host tests (the 435+ unit-test suite)
  # ──────────────────────────────────────────────────────────────────
  test:
    name: Host tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust 1.91 toolchain
        run: |
          rustup toolchain install 1.91 --profile minimal
          rustup default 1.91

      - name: Cache Cargo registry & build
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-test-${{ runner.os }}-1.91-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: cargo-test-${{ runner.os }}-1.91-

      - name: Test (host target only)
        # WASM-target tests live under `cargo test --target
        # wasm32-unknown-unknown` and need wasm-bindgen-test-runner; the
        # wasm-build job below verifies the same code compiles for that
        # target, but running WASM tests under CI requires extra setup
        # we have not yet wired up.
        run: cargo test --workspace --lib --bins --locked

  # ──────────────────────────────────────────────────────────────────
  #  WASM target: ensure both worker crates still compile for
  #  wasm32-unknown-unknown (the deploy target). We don't run tests here
  #  — we just want the build to fail if a non-portable dependency or
  #  feature flag slips in.
  # ──────────────────────────────────────────────────────────────────
  wasm-build:
    name: WASM build (gateway + core)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust 1.91 toolchain with WASM target
        run: |
          rustup toolchain install 1.91 --profile minimal
          rustup default 1.91
          rustup target add wasm32-unknown-unknown

      - name: Cache Cargo registry & build
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-wasm-${{ runner.os }}-1.91-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: cargo-wasm-${{ runner.os }}-1.91-

      - name: Check noye-gateway (wasm32-unknown-unknown)
        run: cargo check -p noye-gateway --target wasm32-unknown-unknown --locked

      - name: Check noye-core (wasm32-unknown-unknown)
        run: cargo check -p noye-core --target wasm32-unknown-unknown --locked

  # ──────────────────────────────────────────────────────────────────
  #  Migration-apply gate: sql/*.sql must apply, in filename order, to
  #  a fresh SQLite database with no manual intervention (DR-MIG-01,
  #  DR-MIG-05). See rfcs/handoffs/01-migration-applicability.md
  #  and scripts/check-migrations.sh.
  # ──────────────────────────────────────────────────────────────────
  migrations:
    name: Migration-apply gate
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # scripts/check-migrations.sh reads tag 0.1.0

      - name: Apply sql/*.sql to a fresh database
        run: bash scripts/check-migrations.sh

  # ──────────────────────────────────────────────────────────────────
  #  Changelog-section extractor gate: scripts/changelog-section.sh is
  #  a release gate (release.yml refuses to publish when it fails, and
  #  trusts its output verbatim when it succeeds), so a regression in
  #  it is invisible until someone tags. See
  #  rfcs/handoffs/04a-release-notes-source.md (G-35) and
  #  scripts/check-changelog-section.sh.
  # ──────────────────────────────────────────────────────────────────
  changelog-section:
    name: Changelog-section extractor gate
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Exercise scripts/changelog-section.sh against fixtures
        run: bash scripts/check-changelog-section.sh

  # ──────────────────────────────────────────────────────────────────
  #  Classify-audit-schema gate: classify-audit-schema.sh's verdict
  #  decides whether subject 06's audit_logs rebuild can be an ordinary
  #  static migration or needs a schema-introspecting routine. See
  #  rfcs/handoffs/06a-classify-audit-schema.md and
  #  scripts/check-classify-audit-schema.sh. Local D1 only — no
  #  --remote flag anywhere in this job.
  # ──────────────────────────────────────────────────────────────────
  classify-audit-schema:
    name: Classify-audit-schema gate
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # scripts/check-classify-audit-schema.sh reads tag 0.1.0

      - name: Install wrangler
        run: npm install -g wrangler@4

      - name: Exercise scripts/classify-audit-schema.sh against local D1 fixtures
        run: bash scripts/check-classify-audit-schema.sh

  # ──────────────────────────────────────────────────────────────────
  #  D1-behaviour gate: drives real HTTP routes and the real scheduled
  #  trigger against a scratch local D1 (workerd, via `wrangler dev
  #  --local`) and asserts on responses AND on resulting database
  #  state -- not on log output, and not on source shape the way the
  #  other gates in this file do. Subject 07f
  #  (rfcs/handoffs/07f-d1-behaviour-ci-harness.md), Option B
  #  (.git-exclude/reviewed/054-d1-ci-harness-proposal.md): no route,
  #  no feature flag, no `#[cfg]` added to either Worker -- see
  #  scripts/check-d1-behaviour.sh's own header for what it asserts
  #  and why one claim (a retention pass deletes only what it
  #  archived, DR-LIF-06) is deliberately not among them yet.
  #
  #  This is the difference between M2a's central claims (a re-import
  #  no longer cascades, an unresolvable owner is refused before any
  #  write) living in an evidence log nobody re-reads, and re-running
  #  on every push.
  # ──────────────────────────────────────────────────────────────────
  d1-behaviour:
    name: D1-behaviour gate
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust 1.91 toolchain with the WASM target
        run: |
          rustup toolchain install 1.91 --profile minimal
          rustup default 1.91
          rustup target add wasm32-unknown-unknown

      - name: Cache Cargo registry & build
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin
            target
          key: cargo-d1behaviour-${{ runner.os }}-1.91-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: cargo-d1behaviour-${{ runner.os }}-1.91-

      - name: Install wrangler and worker-build
        run: |
          npm install -g wrangler@4
          cargo install -q worker-build --locked

      - name: Exercise scripts/check-d1-behaviour.sh against real local D1
        run: bash scripts/check-d1-behaviour.sh

  # ──────────────────────────────────────────────────────────────────
  #  Audit-surfacing gate: no `let _ =` on any db::audit::log*/
  #  log_system* call remains (T-35), and every log_or_report call site
  #  with a response attaches the audit-warning outcome (T-31). Static
  #  grep checks only -- no D1 or Wrangler needed. See
  #  rfcs/handoffs/07-audit-write-surfacing.md and
  #  scripts/check-audit-surfacing.sh.
  # ──────────────────────────────────────────────────────────────────
  audit-surfacing:
    name: Audit-surfacing gate
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Exercise scripts/check-audit-surfacing.sh
        run: bash scripts/check-audit-surfacing.sh

  # ──────────────────────────────────────────────────────────────────
  #  WASM-target tests. The host suite cannot run these: they construct
  #  JsValue, which aborts outside a JS engine. They are the only tests
  #  that exercise the Rust/JS boundary — where G-36, G-38 and G-42 all
  #  lived, and each of the first two made the service completely
  #  non-functional and survived four milestones because nothing
  #  executed this code.
  #
  #  Scoped to noye-shared and noye-gateway:
  #    - noye-core's wasm test binary cannot load at all (G-37) —
  #      wasm-smtp-cloudflare pulls a `cloudflare:`-scheme import Node's
  #      ESM loader rejects before any test filter is consulted.
  #    - noye-gateway's 13 crypto tests failed until subject 07e fixed
  #      G-42 (sha256() cast an ArrayBuffer directly to Uint8Array,
  #      which can never succeed). Excluded until then, deliberately —
  #      a job that is red on arrival gets ignored, which is how a gate
  #      stops being one. All 13 pass now.
  # ──────────────────────────────────────────────────────────────────
  wasm-tests:
    name: WASM tests (noye-shared, noye-gateway)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust 1.91 with the WASM target
        run: |
          rustup toolchain install 1.91 --profile minimal
          rustup default 1.91
          rustup target add wasm32-unknown-unknown

      - name: Cache Cargo registry, build & installed binaries
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin
            target
          key: cargo-wasmtest-${{ runner.os }}-1.91-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: cargo-wasmtest-${{ runner.os }}-1.91-

      - name: Install wasm-bindgen-test-runner matching Cargo.lock
        # The CLI version must equal the wasm-bindgen crate version
        # exactly, or wasm-bindgen refuses to run. Derived from
        # Cargo.lock rather than pinned here, so a dependency bump
        # cannot leave this job silently installing the wrong one.
        run: |
          VERSION="$(awk '/^name = "wasm-bindgen"$/{getline; gsub(/["]/,""); print $3; exit}' Cargo.lock)"
          if [ -z "$VERSION" ]; then
            echo "could not read the wasm-bindgen version from Cargo.lock" >&2
            exit 1
          fi
          echo "wasm-bindgen in Cargo.lock: $VERSION"
          if [ "$(wasm-bindgen-test-runner --version 2>/dev/null | awk '{print $2}')" = "$VERSION" ]; then
            echo "matching runner already present (cache hit)"
          else
            cargo install wasm-bindgen-cli --version "$VERSION" --locked --force
          fi

      - name: Test (wasm32-unknown-unknown, noye-shared)
        # .cargo/config.toml supplies the runner and the getrandom
        # backend flag; Node is preinstalled on the runner.
        run: cargo test -p noye-shared --target wasm32-unknown-unknown --lib --locked

      - name: Test (wasm32-unknown-unknown, noye-gateway)
        # All 13 tests across four crypto modules (SHA-256, random,
        # base64url, JWT verification) — the primitives beneath the
        # audit hash chain, CSRF tokens, session handling and OIDC.
        # T-212/T-216: this step must go red when any one of them
        # fails, proven by deliberately breaking one before merging.
        run: cargo test -p noye-gateway --target wasm32-unknown-unknown --lib --locked

  # ──────────────────────────────────────────────────────────────────
  #  Dependency vulnerability scan
  # ──────────────────────────────────────────────────────────────────
  audit:
    name: cargo-audit
    runs-on: ubuntu-24.04
    # Don't block PRs on a freshly-disclosed advisory — audit is
    # informational on PRs, blocking on push to main + the weekly cron.
    continue-on-error: ${{ github.event_name == 'pull_request' }}
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust 1.91 toolchain
        run: |
          rustup toolchain install 1.91 --profile minimal
          rustup default 1.91

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: Run cargo audit
        # `cargo audit` takes no `--locked` flag — it reads Cargo.lock
        # directly and does no dependency resolution, so there is
        # nothing for `--locked` to pin. Passing it exits 2 before any
        # scanning happens (`error: unexpected argument '--locked'
        # found`), which is what this job did from introduction until
        # gap G-32 (found 2026-07-28, the first time `cargo audit` was
        # run by hand this project's history — see
        # .git-exclude/evidence/README.md and
        # docs/src/requirements.md NFR-SEC-10).
        #
        # --deny warnings would also fail on yanked crates; we want both
        # vulnerabilities and yanks to surface, so the default behavior
        # (exit 1 on either) is fine.
        run: cargo audit
