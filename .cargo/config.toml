# Test runner configuration for wasm32-unknown-unknown.
#
# `cargo test --target wasm32-unknown-unknown` produces .wasm test binaries.
# wasm-bindgen-test-runner spins up Node (or a headless browser) to execute
# them and collect the test results.
#
# Install once with:
#     cargo install wasm-bindgen-cli --version 0.2
#     # `wasm-bindgen-test-runner` ships in the same package
#
# Then run any of:
#     cargo test -p noye-gateway --target wasm32-unknown-unknown
#     cargo test --workspace --target wasm32-unknown-unknown    # all crates
#
# The host-target test suite is unaffected by this file:
#     cargo test --workspace --lib                              # 131 tests
#
# See docs/src/development.md for the full testing matrix.

[target.wasm32-unknown-unknown]
runner = "wasm-bindgen-test-runner"

# Required by `getrandom` 0.4 (pulled in transitively via wasm-smtp's
# `scram-sha-256` feature, which is default-on as of 0.9.3). The flag
# selects the JavaScript-backed RNG on the WASM target. It is a
# `getrandom` 0.4 design decision that cannot be expressed as a cargo
# feature, so the consumer-side `--cfg` is unavoidable.
#
# If `scram-sha-256` is ever disabled on `wasm-smtp-cloudflare`
# (i.e. `default-features = false` without re-enabling SCRAM), this
# flag becomes harmless dead config — `getrandom` would not be in the
# dep graph at all.
rustflags = ['--cfg=getrandom_backend="wasm_js"']
