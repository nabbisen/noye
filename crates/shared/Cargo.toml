[package]
name        = "noye-shared"
description = "Shared types between Noye gateway and core workers"
version.workspace       = true
edition.workspace       = true
rust-version.workspace  = true
license.workspace       = true
authors.workspace       = true
repository.workspace    = true

[dependencies]
serde                       = { workspace = true }
serde_json                  = { workspace = true }

[dev-dependencies]
# WASM-runtime tests for D1 deserialization (subject 07b, G-36) --
# these structs are what `worker`'s D1Result::results/first deserialize
# into on the Core side, but this crate itself has no Cloudflare
# Worker dependency, so its wasm test binary loads cleanly under Node
# (unlike noye-core's, which pulls in wasm-smtp-cloudflare's
# `cloudflare:`-scheme import and fails to load under plain Node at
# all). Run with: cargo test -p noye-shared --target wasm32-unknown-unknown
wasm-bindgen                = { workspace = true }
js-sys                      = { workspace = true }
wasm-bindgen-test           = { workspace = true }
serde-wasm-bindgen          = { workspace = true }
