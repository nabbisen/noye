name = "noye-gateway"
main = "build/worker/shim.mjs"
compatibility_date = "2024-04-13"
workers_dev = true  # 本番では false にし、カスタムルート設定を推奨

[build]
command = "cargo install -q worker-build && worker-build --release"

# KV (セッションストア + OIDC state + JWKS キャッシュ)
[[kv_namespaces]]
binding = "CACHE_KV"
id = "YOUR_KV_ID_HERE"

# Service Binding: Core ワーカーへの内部呼び出し
[[services]]
binding = "CORE"
service = "noye-core"
# 本番環境では environment = "production" を指定することを推奨

# 環境変数
[vars]
# ── OIDC 認証 ──
OIDC_ISSUER_URL = "https://accounts.google.com"
OIDC_CLIENT_ID = "YOUR_OIDC_CLIENT_ID"
OIDC_REDIRECT_URI = "https://noye-gateway.example.com/auth/callback"
OIDC_SCOPES = "openid email profile"
SESSION_COOKIE_NAME = "noye_session"
SESSION_DURATION_MIN = "480"

# ── Turnstile (公開フォーム限定) ──
TURNSTILE_SITE_KEY = "YOUR_TURNSTILE_SITE_KEY"

# NOTE: 以下は Secret として登録する (wrangler secret put <NAME>):
#   OIDC_CLIENT_SECRET       - OIDC クライアントシークレット
#   GATEWAY_SHARED_TOKEN     - Core との共有秘密 (Core 側にも同じ値を登録)
#   TURNSTILE_SECRET_KEY     - Turnstile のシークレット鍵
